<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>我的生活工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#7c3aed"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="我的工作台"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<style>
:root {
  --bg: #0f0a1a;
  --bg2: #1a1030;
  --card: rgba(30,20,55,0.85);
  --card-hover: rgba(40,28,70,0.9);
  --primary: #8b5cf6;
  --primary-light: #a78bfa;
  --accent: #c084fc;
  --accent2: #f472b6;
  --gold: #f59e0b;
  --green: #34d399;
  --red: #f87171;
  --blue: #60a5fa;
  --text: #e2e0f0;
  --text2: #a098c0;
  --text3: #6b6280;
  --border: rgba(139,92,246,0.15);
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 8px 32px rgba(0,0,0,0.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Noto Sans SC',-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;display:flex;overflow:hidden;
}
/* 侧边栏 */
.sidebar{
  width:84px;flex-shrink:0;
  background:rgba(15,10,26,0.95);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;
  padding:20px 0 12px;gap:4px;z-index:10;
  overflow-y:auto;
}
.avatar-ring{
  width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--primary));
  display:flex;align-items:center;justify-content:center;
  font-size:20px;margin-bottom:6px;flex-shrink:0;
}
.sidebar .user-name{font-size:10px;color:var(--text2);margin-bottom:8px;flex-shrink:0;}
.nav-item{
  width:68px;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:8px 4px;border-radius:14px;cursor:pointer;
  transition:all 0.2s;color:var(--text3);user-select:none;flex-shrink:0;
}
.nav-item .icon{
  width:34px;height:34px;border-radius:12px;display:flex;
  align-items:center;justify-content:center;font-size:17px;
  background:rgba(139,92,246,0.08);transition:all 0.2s;
}
.nav-item .label{font-size:10px;font-weight:500;text-align:center;line-height:1.2;}
.nav-item:hover{color:var(--text2)}
.nav-item:hover .icon{background:rgba(139,92,246,0.18)}
.nav-item.active{color:var(--primary-light)}
.nav-item.active .icon{
  background:linear-gradient(135deg,var(--accent),var(--primary));
  color:#fff;box-shadow:0 4px 14px rgba(139,92,246,0.35);
}

/* 主内容 */
.main{flex:1;overflow-y:auto;padding:20px 18px;}
.section{display:none;animation:fadeIn 0.3s ease}
.section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* 头部 */
.page-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.page-header .icon{font-size:24px}
.page-header h1{font-size:22px;font-weight:700}
.page-header .sub{font-size:12px;color:var(--text3);margin-top:2px}
.date-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 12px;border-radius:20px;background:rgba(139,92,246,0.12);
  font-size:12px;color:var(--primary-light);margin-left:auto;
}

/* 卡片 */
.card{
  background:var(--card);backdrop-filter:blur(20px);
  border-radius:var(--radius);padding:16px;margin-bottom:14px;
  box-shadow:var(--shadow);border:1px solid var(--border);
}
.card-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-subtitle{font-size:12px;color:var(--text3);margin-bottom:10px}

/* 进度圆环 */
.ring-wrap{
  display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;
  padding:10px 0;
}
.ring-box{text-align:center}
.ring-box svg{width:80px;height:80px}
.ring-box .pct{font-size:18px;font-weight:700;fill:var(--text)}
.ring-box .label{font-size:11px;color:var(--text3);margin-top:4px}

/* 九宫格 */
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid-item{
  background:rgba(139,92,246,0.06);border-radius:var(--radius-sm);
  padding:14px 10px;text-align:center;cursor:pointer;
  border:1px solid transparent;transition:all 0.2s;
}
.grid-item:hover{background:rgba(139,92,246,0.12);border-color:var(--border)}
.grid-item .gi-icon{font-size:26px;margin-bottom:4px}
.grid-item .gi-name{font-size:12px;font-weight:600;color:var(--text2)}
.grid-item .gi-stat{font-size:10px;color:var(--text3);margin-top:2px}

/* 输入控件 */
input,textarea,select{
  width:100%;padding:10px 12px;border:1px solid var(--border);
  border-radius:12px;background:rgba(20,12,40,0.6);font-family:inherit;
  font-size:13px;color:var(--text);outline:none;transition:all 0.2s;margin-bottom:10px;
}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(139,92,246,0.12)}
textarea{min-height:70px;resize:vertical}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:10px 18px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--primary));
  color:#fff;font-weight:600;font-size:13px;cursor:pointer;
  box-shadow:0 4px 16px rgba(139,92,246,0.3);transition:all 0.15s;
  font-family:inherit;
}
.btn:active{transform:scale(0.97)}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:10px}
.btn-outline{
  background:transparent;border:1px solid var(--primary);
  color:var(--primary-light);box-shadow:none;
}
.btn-danger{background:linear-gradient(135deg,#f87171,#dc2626);box-shadow:0 4px 14px rgba(248,113,113,0.3)}

.row{display:flex;gap:10px;flex-wrap:wrap}
.col{flex:1;min-width:100px}

/* 标签 */
.tag{
  display:inline-flex;align-items:center;gap:3px;
  padding:5px 10px;border-radius:16px;background:rgba(139,92,246,0.1);
  color:var(--primary-light);font-size:11px;font-weight:500;
  cursor:pointer;transition:all 0.2s;margin:0 4px 6px 0;
}
.tag.active,.tag:hover{background:var(--primary);color:#fff}

/* 列表 */
.list-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;background:rgba(20,12,40,0.5);border-radius:12px;
  margin-bottom:8px;font-size:13px;
}
.list-item .info{display:flex;flex-direction:column}
.list-item .meta{font-size:11px;color:var(--text3);margin-top:2px}
.list-item .del{color:var(--red);cursor:pointer;font-size:12px;opacity:0.7}
.list-item .del:hover{opacity:1}

.empty{text-align:center;color:var(--text3);font-size:12px;padding:14px}

/* 进度条 */
.progress-bar{
  height:8px;background:rgba(139,92,246,0.1);border-radius:4px;
  overflow:hidden;margin:6px 0;
}
.progress-fill{
  height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--accent),var(--primary));
  transition:width 0.5s ease;
}

/* 皮肤护理时间轴 */
.timeline{position:relative;padding-left:20px}
.timeline::before{
  content:'';position:absolute;left:6px;top:4px;bottom:4px;
  width:2px;background:var(--border);
}
.tl-item{
  position:relative;padding:6px 0 6px 18px;font-size:13px;
  display:flex;align-items:center;gap:8px;
}
.tl-item::before{
  content:'';position:absolute;left:-17px;top:12px;
  width:10px;height:10px;border-radius:50%;
  background:var(--primary);border:2px solid var(--bg);
}
.tl-item .time{font-size:11px;color:var(--text3);min-width:40px}
.tl-item.done::before{background:var(--green)}

/* 转盘 */
.wheel-wrap{position:relative;text-align:center;padding:10px 0}
.wheel-text{
  font-size:40px;animation:bounce 0.5s ease;display:inline-block;
}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}

/* 小额 */
.stat-row{display:flex;justify-content:space-around;text-align:center;margin:8px 0}
.stat-item .val{font-size:20px;font-weight:700}
.stat-item .lbl{font-size:11px;color:var(--text3)}

.check-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.check-row:last-child{border:none}
.check-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary);flex-shrink:0}
.check-row .done{text-decoration:line-through;color:var(--text3)}

/* 移动端适配 */
@media(max-width:640px){
  .sidebar{width:60px;padding:14px 0 8px;gap:2px}
  .avatar-ring{width:36px;height:36px;font-size:16px}
  .nav-item{width:50px;padding:6px 2px}
  .nav-item .icon{width:28px;height:28px;font-size:14px;border-radius:10px}
  .nav-item .label{font-size:8px}
  .main{padding:14px 10px}
  .grid-3{grid-template-columns:repeat(3,1fr);gap:6px}
  .grid-item{padding:10px 6px}
  .ring-box svg{width:60px;height:60px}
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="avatar-ring">✨</div>
  <div class="user-name">我的工作台</div>
  <div class="nav-item active" data-p="dashboard"><div class="icon">🏠</div><span class="label">今日</span></div>
  <div class="nav-item" data-p="todo"><div class="icon">✅</div><span class="label">待办</span></div>
  <div class="nav-item" data-p="fitness"><div class="icon">💪</div><span class="label">健身</span></div>
  <div class="nav-item" data-p="skincare"><div class="icon">✨</div><span class="label">护肤</span></div>
  <div class="nav-item" data-p="outfit"><div class="icon">👗</div><span class="label">穿搭</span></div>
  <div class="nav-item" data-p="food"><div class="icon">🍳</div><span class="label">一人食</span></div>
  <div class="nav-item" data-p="finance"><div class="icon">💰</div><span class="label">财务</span></div>
  <div class="nav-item" data-p="weight"><div class="icon">⚖️</div><span class="label">体重</span></div>
  <div class="nav-item" data-p="study"><div class="icon">📚</div><span class="label">学习</span></div>
  <div class="nav-item" data-p="news"><div class="icon">📰</div><span class="label">资讯</span></div>
</aside>

<main class="main" id="mainContent"></main>

<script>
// === 工具函数 ===
const today=()=>new Date().toISOString().split('T')[0];
const getD=(k)=>JSON.parse(localStorage.getItem('wb_'+k)||'[]');
const setD=(k,v)=>localStorage.setItem('wb_'+k,JSON.stringify(v));
const now=new Date();
const week=['日','一','二','三','四','五','六'];
const dateStr=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · 星期${week[now.getDay()]}`;
const rand=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;

// === 导航 ===
document.querySelectorAll('.nav-item').forEach(el=>{
  el.addEventListener('click',()=>{
    document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
    el.classList.add('active');
    renderPage(el.dataset.p);
  });
});

// === 页面渲染 ===
function renderPage(page){
  const m=document.getElementById('mainContent');
  switch(page){
    case 'dashboard':m.innerHTML=dashboardHTML();initDashboard();break;
    case 'todo':m.innerHTML=todoHTML();initTodo();break;
    case 'fitness':m.innerHTML=fitnessHTML();initFitness();break;
    case 'skincare':m.innerHTML=skincareHTML();initSkincare();break;
    case 'outfit':m.innerHTML=outfitHTML();initOutfit();break;
    case 'food':m.innerHTML=foodHTML();initFood();break;
    case 'finance':m.innerHTML=financeHTML();initFinance();break;
    case 'weight':m.innerHTML=weightHTML();initWeight();break;
    case 'study':m.innerHTML=studyHTML();initStudy();break;
    case 'news':m.innerHTML=newsHTML();initNews();break;
  }
}

// ============================================================
// 首页 Dashboard
// ============================================================
function dashboardHTML(){
  const todoCount=getD('todos').filter(t=>t.done).length;
  const todoTotal=getD('todos').length;
  const todoPct=todoTotal?Math.round(todoCount/todoTotal*100):0;
  const fitCount=getD('workouts').filter(w=>w.date===today()).length;
  const fitPct=Math.min(fitCount*25,100);
  const skinCount=getD('skincareDone').filter(s=>s.date===today()).length;
  const skinPct=Math.min(skinCount*20,100);
  return `<section class="section active">
<div class="page-header"><span class="icon">✨</span><div><h1>今日成长</h1><div class="sub">${dateStr}</div></div><span class="date-badge">🌙 晚安计划</span></div>

<div class="card">
  <div class="card-title">📊 今日完成度</div>
  <div class="ring-wrap">
    <div class="ring-box"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(139,92,246,0.15)" stroke-width="8"/><circle cx="50" cy="50" r="42" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${todoPct*2.64} 264" transform="rotate(-90 50 50)"/><defs><linearGradient id="g1"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><text x="50" y="48" text-anchor="middle" class="pct">${todoPct}%</text><text x="50" y="62" text-anchor="middle" font-size="9" fill="#6b6280">待办</text></svg><div class="label">待办完成</div></div>
    <div class="ring-box"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(244,114,182,0.15)" stroke-width="8"/><circle cx="50" cy="50" r="42" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${fitPct*2.64} 264" transform="rotate(-90 50 50)"/><defs><linearGradient id="g2"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><text x="50" y="48" text-anchor="middle" class="pct">${fitPct}%</text><text x="50" y="62" text-anchor="middle" font-size="9" fill="#6b6280">健身</text></svg><div class="label">健身打卡</div></div>
    <div class="ring-box"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(52,211,153,0.15)" stroke-width="8"/><circle cx="50" cy="50" r="42" fill="none" stroke="url(#g3)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${skinPct*2.64} 264" transform="rotate(-90 50 50)"/><defs><linearGradient id="g3"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><text x="50" y="48" text-anchor="middle" class="pct">${skinPct}%</text><text x="50" y="62" text-anchor="middle" font-size="9" fill="#6b6280">护肤</text></svg><div class="label">护肤打卡</div></div>
  </div>
</div>

<div class="card">
  <div class="card-title">🎯 快捷入口</div>
  <div class="grid-3">
    <div class="grid-item" onclick="switchPage('todo')"><div class="gi-icon">✅</div><div class="gi-name">待办清单</div><div class="gi-stat">${todoCount}/${todoTotal} 已完成</div></div>
    <div class="grid-item" onclick="switchPage('fitness')"><div class="gi-icon">💪</div><div class="gi-name">健身打卡</div><div class="gi-stat">${fitCount} 项已完成</div></div>
    <div class="grid-item" onclick="switchPage('weight')"><div class="gi-icon">⚖️</div><div class="gi-name">体重管理</div><div class="gi-stat">记录每一天</div></div>
    <div class="grid-item" onclick="switchPage('skincare')"><div class="gi-icon">✨</div><div class="gi-name">护肤日常</div><div class="gi-stat">${skinCount} 项已完成</div></div>
    <div class="grid-item" onclick="switchPage('study')"><div class="gi-icon">📚</div><div class="gi-name">学习打卡</div><div class="gi-stat">英语 · 韩语</div></div>
    <div class="grid-item" onclick="switchPage('food')"><div class="gi-icon">🍳</div><div class="gi-name">一人食</div><div class="gi-stat">今天吃什么</div></div>
    <div class="grid-item" onclick="switchPage('finance')"><div class="gi-icon">💰</div><div class="gi-name">财务储蓄</div><div class="gi-stat">记账·存钱</div></div>
    <div class="grid-item" onclick="switchPage('outfit')"><div class="gi-icon">👗</div><div class="gi-name">穿搭衣橱</div><div class="gi-stat">26°穿衣法则</div></div>
    <div class="grid-item" onclick="switchPage('news')"><div class="gi-icon">📰</div><div class="gi-name">每日资讯</div><div class="gi-stat">行业报告</div></div>
  </div>
</div>
</section>`;
}
function initDashboard(){}
function switchPage(p){
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  document.querySelector(`[data-p="${p}"]`).classList.add('active');
  renderPage(p);
}

// ============================================================
// 待办清单
// ============================================================
function todoHTML(){
  const list=getD('todos');
  let items=list.length?list.map((t,i)=>`<div class="check-row"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTodo(${i})"><span class="${t.done?'done':''}">${t.text}</span><span style="margin-left:auto;font-size:11px;color:var(--text3)">${t.date}</span><span class="del" onclick="delTodo(${i})" style="margin-left:8px">✕</span></div>`).join(''):'<div class="empty">还没有待办事项～</div>';
  return `<section class="section active">
<div class="page-header"><span class="icon">✅</span><div><h1>今日待办</h1><div class="sub">把重要的事情一件件完成</div></div><span class="date-badge">${dateStr}</span></div>
<div class="card">
  <div class="card-title">➕ 新增待办</div>
  <div class="row"><div class="col"><input id="todoInput" placeholder="输入待办事项..."></div><button class="btn btn-sm" onclick="addTodo()">添加</button></div>
</div>
<div class="card"><div class="card-title">📋 待办列表</div><div id="todoList">${items}</div></div>
</section>`;
}
function initTodo(){}
function addTodo(){
  const inp=document.getElementById('todoInput');
  const text=inp.value.trim();
  if(!text)return;
  const d=getD('todos');d.push({text,done:false,date:today()});setD('todos',d);
  inp.value='';renderPage('todo');
}
function toggleTodo(i){const d=getD('todos');d[i].done=!d[i].done;setD('todos',d);renderPage('todo');}
function delTodo(i){const d=getD('todos');d.splice(i,1);setD('todos',d);renderPage('todo');}

// ============================================================
// 健身打卡
// ============================================================
function fitnessHTML(){
  const todayList=getD('workouts').filter(w=>w.date===today());
  const cal=todayList.reduce((s,w)=>s+(w.cal||0),0);
  const list=todayList.length?todayList.map((w,i)=>`<div class="list-item"><div class="info"><div>${w.name} · ${w.detail}</div><div class="meta">🔥 ${w.cal||0} 千卡</div></div><span class="del" onclick="delWorkout('${w.name}')">取消</span></div>`).join(''):'<div class="empty">今天还没有运动打卡～</div>';
  const all=getD('workouts');
  const byDate={};all.forEach(w=>{(byDate[w.date]=byDate[w.date]||[]).push(w)});
  const dates=Object.keys(byDate).sort().reverse();
  let hist='';
  if(dates.length){
    hist=dates.slice(0,7).map(d=>{const dayCal=byDate[d].reduce((s,w)=>s+(w.cal||0),0);return`<div style="margin-bottom:10px;padding:10px 12px;background:rgba(20,12,40,0.5);border-radius:12px;"><div style="font-weight:700;font-size:13px;margin-bottom:4px;color:var(--primary-light);">📅 ${d} · 🔥${dayCal}千卡</div><div style="display:flex;flex-wrap:wrap;gap:5px;">${byDate[d].map(w=>`<span class="tag active">${w.name} ${w.detail}</span>`).join('')}</div></div>`}).join('');
  }else{hist='<div class="empty">还没有运动记录～</div>';}
  return `<section class="section active">
<div class="page-header"><span class="icon">💪</span><div><h1>健身打卡</h1><div class="sub">今日消耗 🔥${cal} 千卡</div></div></div>
<div class="card"><div class="card-title">🏃 有氧运动</div><div class="row" id="cardioTags" style="gap:6px"></div></div>
<div class="card"><div class="card-title">🏋️ 力量训练</div><div class="row" id="strengthTags" style="gap:6px"></div></div>
<div class="card"><div class="card-title">🧘 核心柔韧</div><div class="row" id="coreTags" style="gap:6px"></div></div>
<div class="card"><div class="card-title">📅 今日打卡</div><div id="workoutDone">${list}</div></div>

window.pickFit=function(name,unit,options,calPer,emoji){
  const todayList=getD('workouts').filter(w=>w.date===today()&&w.name===name);

  const val=options[Math.floor(options.length/2)];
  const uL=(u)=>({min:'分钟',km:'公里',rep:'个',set:'组'}[u]||u);
  const cal=Math.round(val*calPer);

function initOutfit(){}
function calcOutfit(){
  const t=parseInt(document.getElementById('tempInput').value)||25;
  const diff=26-t;
  let advice='';
  if(diff<=0)advice='🧊 今天很热！推荐：吊带/短袖 + 短裤/短裙，轻薄透气为主';
  else if(diff<=3)advice='🌤️ 微热天气：T恤 + 薄长裤/半裙，带件薄开衫备用';
  else if(diff<=6)advice='🍂 舒适温度：薄针织/衬衫 + 牛仔裤/长裙，可加轻薄外套';
  else if(diff<=10)advice='🧥 偏凉天气：毛衣/卫衣 + 厚长裤，推荐风衣或牛仔外套';
  else advice='❄️ 很冷！厚毛衣 + 羽绒服/大衣 + 围巾，注意保暖';
  document.getElementById('outfitResult').innerHTML=`穿搭温度 = 26 - ${t} = <b>${diff}°C</b> → ${advice}`;
}
function addWardrobe(){
  const name=document.getElementById('wardrobeInput').value.trim();
  const cat=document.getElementById('wardrobeCat').value;
  const color=document.getElementById('wardrobeColor').value.trim()||'未标注';

  const d=getD('wardrobe');d.push({name,cat,color,emoji});setD('wardrobe',d);
  document.getElementById('wardrobeInput').value='';
  renderPage('outfit');
}

function addMoney(){
  const type=document.getElementById('moneyType').value;

  if(!amount||amount<=0)return;
  const d=getD('money');d.push({type,amount,tag,date:today()});setD('money',d);
  document.getElementById('moneyAmount').value='';document.getElementById('moneyTag').value='';
  renderPage('finance');

function addSaving(){
  const amt=Number(document.getElementById('saveAmount').value);
  if(!amt||amt<=0)return;
  let goals=getD('savingsGoal');
  if(!goals.length)goals=[{target:10000,current:0}];
  goals[0].current+=amt;setD('savingsGoal',goals);
  document.getElementById('saveAmount').value='';
  renderPage('finance');
}

function initStudy(){}
function toggleStudy(lang,name){
  const key=lang==='english'?'englishStudy':'koreanStudy';
  const d=getD(key);const idx=d.findIndex(s=>s.name===name&&s.date===today());
  if(idx>=0)d.splice(idx,1);else d.push({name,date:today()});
  setD(key,d);renderPage('study');
}
